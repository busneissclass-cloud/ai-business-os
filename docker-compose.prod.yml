# Production overlay: HTTPS via Caddy (automatic Let's Encrypt).
# Usage on VPS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
    restart: unless-stopped

  api:
    ports: []  # only exposed through Caddy in prod

volumes:
  caddydata:
