# AI Business OS — M0 foundation stack
# Production target: single VPS. `docker compose up -d` → healthy.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aibos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: aibos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://aibos:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aibos
      REDIS_URL: redis://redis:6379/0
      API_SECRET: ${API_SECRET:-change-me-in-production}
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A worker.celery_app.celery worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://aibos:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aibos
      REDIS_URL: redis://redis:6379/0
      API_SECRET: ${API_SECRET:-change-me-in-production}
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A worker.celery_app.celery beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://aibos:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aibos
      REDIS_URL: redis://redis:6379/0
      ENV: production
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
